[env]
PROJECT_ROOT = "{{config_root}}"
BUILD_DIR = "build"
DEBUG_BUILD_DIR = "build-debug"
STATIC_BUILD_DIR = "build-static"
CUDA_BUILD_DIR = "build-cuda"
CPU_ONLY_BUILD_DIR = "build-cpu"

[tasks.status]
description = "Show the local repo status and current upstream remote"
run = "git status --short --branch && git remote -v"

[tasks.sync-source]
description = "Fetch and fast-forward the local checkout from the official GitHub repo"
run = "git fetch origin --prune --tags && git pull --ff-only"

[tasks.full-history]
description = "Convert the shallow clone into a full clone"
run = "git fetch --unshallow --tags origin"

[tasks.build]
description = "Build llama.cpp with the default local backend selection"
run = "cmake -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Release && cmake --build ${BUILD_DIR} --config Release -j $(sysctl -n hw.ncpu)"

[tasks.build-debug]
description = "Build a debug configuration"
run = "cmake -B ${DEBUG_BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug && cmake --build ${DEBUG_BUILD_DIR} -j $(sysctl -n hw.ncpu)"

[tasks.build-static]
description = "Build static binaries and libraries"
run = "cmake -B ${STATIC_BUILD_DIR} -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF && cmake --build ${STATIC_BUILD_DIR} --config Release -j $(sysctl -n hw.ncpu)"

[tasks.build-cpu]
description = "Build a CPU-only variant with Metal disabled"
run = "cmake -B ${CPU_ONLY_BUILD_DIR} -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=OFF && cmake --build ${CPU_ONLY_BUILD_DIR} --config Release -j $(sysctl -n hw.ncpu)"

[tasks.build-cuda]
description = "Build with CUDA enabled"
run = "cmake -B ${CUDA_BUILD_DIR} -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON && cmake --build ${CUDA_BUILD_DIR} --config Release -j $(sysctl -n hw.ncpu)"

[tasks.test]
description = "Run CTest against the default build directory"
run = "ctest --test-dir ${BUILD_DIR} --output-on-failure"

[tasks.python-sync]
description = "Create a local Python virtual environment and install helper-script dependencies with uv"
run = "uv venv .venv && uv sync"

[tasks.run-cli]
description = "Run llama-cli with a local GGUF model; pass MODEL=/absolute/path/to/model.gguf"
run = "./${BUILD_DIR}/bin/llama-cli -m \"${MODEL:?Set MODEL=/absolute/path/to/model.gguf}\""

[tasks.run-hf]
description = "Download a model from Hugging Face and run it with llama-cli; pass HF_MODEL=org/model-name"
run = "./${BUILD_DIR}/bin/llama-cli -hf \"${HF_MODEL:?Set HF_MODEL=org/model-name}\""

[tasks.serve-nomic-embed]
description = "Start nomic-ai/nomic-embed-text-v2-moe-GGUF as background embedding server on :18081"
run = """
nohup ./${BUILD_DIR}/bin/llama-server --hf-repo nomic-ai/nomic-embed-text-v2-moe-GGUF --hf-file nomic-embed-text-v2-moe.Q4_K_M.gguf --embeddings --port 18081 -np 4 \
  > /tmp/llama-nomic-embed.log 2>&1 &
echo $! > /tmp/llama-nomic-embed.pid
echo "Embedding server started (PID $(cat /tmp/llama-nomic-embed.pid)) - http://localhost:18081"
echo "Logs: tail -f /tmp/llama-nomic-embed.log"
"""

[tasks.serve-qwen3-embedding-0-6b]
description = "Start Qwen/Qwen3-Embedding-0.6B-GGUF as background embedding server on :18082"
run = """
nohup ./${BUILD_DIR}/bin/llama-server --hf-repo Qwen/Qwen3-Embedding-0.6B-GGUF --hf-file Qwen3-Embedding-0.6B-Q8_0.gguf --embeddings --port 18082 -np 4 \
  > /tmp/llama-qwen3-embedding-0-6b.log 2>&1 &
echo $! > /tmp/llama-qwen3-embedding-0-6b.pid
echo "Embedding server started (PID $(cat /tmp/llama-qwen3-embedding-0-6b.pid)) - http://localhost:18082"
echo "Logs: tail -f /tmp/llama-qwen3-embedding-0-6b.log"
"""

[tasks.serve-bge-m3]
description = "Start CompendiumLabs/bge-m3-gguf as background embedding server on :18083 (CLS pooling, model default)"
run = """
nohup ./${BUILD_DIR}/bin/llama-server -hf CompendiumLabs/bge-m3-gguf -hff bge-m3-f16.gguf --embeddings -c 8192 --port 18083 -np 4 \
  > /tmp/llama-bge-m3.log 2>&1 &
echo $! > /tmp/llama-bge-m3.pid
echo "Embedding server started (PID $(cat /tmp/llama-bge-m3.pid)) - http://localhost:18083"
echo "Logs: tail -f /tmp/llama-bge-m3.log"
"""

[tasks.stop-bge-m3]
description = "Stop the background bge-m3 embedding server"
run = """
PID_FILE=/tmp/llama-bge-m3.pid
if [ -f "$PID_FILE" ]; then
  kill "$(cat $PID_FILE)" && rm "$PID_FILE" && echo "Server stopped."
else
  echo "No PID file found — server may not be running."
fi
"""

[tasks.serve]
description = "Start the OpenAI-compatible server with a local GGUF model; pass MODEL=/absolute/path/to/model.gguf"
run = "./${BUILD_DIR}/bin/llama-server -m \"${MODEL:?Set MODEL=/absolute/path/to/model.gguf}\""

[tasks.serve-hf]
description = "Start the OpenAI-compatible server with a Hugging Face model; pass HF_MODEL=org/model-name"
run = "./${BUILD_DIR}/bin/llama-server -hf \"${HF_MODEL:?Set HF_MODEL=org/model-name}\""

[tasks.clean]
description = "Remove local build directories and the Python virtual environment"
run = "rm -rf ${BUILD_DIR} ${DEBUG_BUILD_DIR} ${STATIC_BUILD_DIR} ${CUDA_BUILD_DIR} ${CPU_ONLY_BUILD_DIR} .venv .pytest_cache .ruff_cache"

[tasks.show-downloaded-models]
description = "Show the downloaded models"
run = """
./build/bin/llama-server --cache-list
"""

